esphome:
  name: watermeter

esp32:
  variant: esp32
  framework:
    type: esp-idf


logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Watermeter_Fallback"
    password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
  version: 3


external_components:
  - source: github://vanderoest/esphome-ldc1314
    components: [ldc1314, watermeter]
    refresh: 0s

i2c:
  sda: GPIO26
  scl: GPIO25
  frequency: 400kHz         # 50 kHz cannot sustain 100 Hz -- see .plan Part 1.4

ldc1314:
  - id: ldc
    address: 0x2A
    update_interval: 10ms   # 100 Hz -- see .plan Part 1.1 (Phase A trace capture)
    reference_clock: internal
    deglitch: 10MHZ
    output_gain: 8            # Phase B register tuning -- see TODO.md; per-channel offset below
                               # is fitted just under each channel's own measured minimum ratio
    high_current_drive: false
    sensor_activation_mode: FULL_CURRENT
    report_errors_on_intb: false

watermeter:
  id: meter
  phases: [coil_0, coil_1, coil_2]
  liters_per_revolution: 1.0
  direction: cw               # flip to ccw if a real draw decreases the volume instead of increasing it
  reverse: subtract
  hysteresis: 10deg
  min_signal: 0.3
  save_threshold: 1.0
  save_interval: 60s
  initial_value: 0

sensor:
  - platform: ldc1314
    ldc1314_id: ldc
    channel: 0
    id: coil_0
    internal: true          # 100 Hz raw codes feed the decoder, never Home Assistant
    rcount: 0x04D6
    settlecount: 0x0020
    fin_divider: 1
    fref_divider: 2
    idrive: 23
    offset: 0x397B             # ratio_lo 0.2275 minus ~0.003 margin, from full-capture min/max
  - platform: ldc1314
    ldc1314_id: ldc
    channel: 1
    id: coil_1
    internal: true          # 100 Hz raw codes feed the decoder, never Home Assistant
    rcount: 0x04D6
    settlecount: 0x0020
    fin_divider: 1
    fref_divider: 2
    idrive: 23
    offset: 0x393B             # ratio_lo 0.2266 minus ~0.003 margin
  - platform: ldc1314
    ldc1314_id: ldc
    channel: 2
    id: coil_2
    internal: true          # 100 Hz raw codes feed the decoder, never Home Assistant
    rcount: 0x04D6
    settlecount: 0x0020
    fin_divider: 1
    fref_divider: 2
    idrive: 23
    offset: 0x3BBB             # ratio_lo 0.2363 minus ~0.003 margin
  # The dashboard-facing view of the raw channels. coil_0/1/2 above (what watermeter: actually
  # reads) stay completely raw, unfiltered and `internal:` -- a sensor filter changes the entity's
  # real state, not just its display, so smoothing was deliberately kept off the source sensors and
  # applied here instead, on independent `copy` entities.
  #
  # `send_every: 20` is the rate limit, not the smoothing: the window still averages every one of
  # the 100 samples/s, but only one result per 20 samples (5 Hz) is published. Publishing at the
  # full acquisition rate meant 300 states/s over the API for three channels nobody reads at that
  # resolution -- and these are the only ldc1314 entities HA sees at all, so this is where the
  # project's 5 Hz publish ceiling has to be enforced.
  - platform: copy
    source_id: coil_0
    name: "LDC Channel 0 Raw (smoothed)"
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 20        # 100 Hz / 20 = 5 Hz to Home Assistant
  - platform: copy
    source_id: coil_1
    name: "LDC Channel 1 Raw (smoothed)"
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 20        # 100 Hz / 20 = 5 Hz to Home Assistant
  - platform: copy
    source_id: coil_2
    name: "LDC Channel 2 Raw (smoothed)"
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 20        # 100 Hz / 20 = 5 Hz to Home Assistant
  - platform: watermeter
    watermeter_id: meter
    volume:
      name: "Water"
    flow_rate:
      name: "Water flow"
    angle:
      name: "Rotor angle"
    signal_quality:
      name: "Signal quality"
    revolutions:
      name: "Revolutions"
    reverse_volume:
      name: "Reverse flow"

button:
  # On-demand datasheet-conformance report -- see README "Datasheet conformance report".
  - platform: ldc1314
    ldc1314_id: ldc
    name: "LDC diagnostics"
  # Learn pass: press, then let water run continuously for `duration` -- needs to cover at least
  # one full revolution, doesn't need to be exact -- to capture per-phase mid/amp. See TODO.md Phase D.
  - platform: watermeter
    watermeter_id: meter
    name: "Watermeter learn pass"
    duration: 60s

switch:
  # Toggle the TRACE,ts,ch0,ch1,ch2 log line for a capture session -- no reflash needed either
  # direction. See README "Raw trace capture".
  - platform: ldc1314
    ldc1314_id: ldc
    name: "LDC trace capture"

binary_sensor:
  - platform: ldc1314
    ldc1314_id: ldc
    channel: 0
    name: "LDC Channel 0 Error"
  - platform: ldc1314
    ldc1314_id: ldc
    channel: 1
    name: "LDC Channel 1 Error"
  - platform: ldc1314
    ldc1314_id: ldc
    channel: 2
    name: "LDC Channel 2 Error"
  - platform: watermeter
    watermeter_id: meter
    flowing:
      name: "Water flowing"
    continuous_flow:
      name: "Possible leak"
      min_duration: 30min
